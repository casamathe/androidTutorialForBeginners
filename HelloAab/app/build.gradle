plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.helloaab'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.helloaab'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // Fournis ces valeurs via variables d'environnement (CI) ou gradle.properties local.
            def ks = System.getenv('KEYSTORE_FILE') ?: project.findProperty('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: project.findProperty('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: project.findProperty('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD') ?: project.findProperty('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
