name: HelloAab bundle

on:
  workflow_dispatch:
  push:
    paths: ['HelloAab/**']

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HelloAab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build AAB and debug APK
        run: gradle :app:bundleRelease :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: HelloAab/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: HelloAab/app/build/outputs/bundle/release/*.aab
